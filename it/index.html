<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Calendario di Stagione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout concept: a market-stall ledger. Sticky filter column on the left, results as ledger rows,
   each row carrying a 12-cell year strip coloured by season. */
:root{
  --bg:#EFF2EC;
  --surface:#F8FAF6;
  --ink:#14231A;
  --muted:#58685D;
  --line:#D3DACF;
  --accent:#1D5C3D;
  --accent-fg:#F4F8F2;
  --cell-off:#E3E8DF;
  --winter:#3D5A99; --winter-fg:#FFFFFF;
  --spring:#2F7A33; --spring-fg:#FFFFFF;
  --summer:#E8A800; --summer-fg:#1D1500;
  --autumn:#B4571B; --autumn-fg:#FFFFFF;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1610; --surface:#152019; --ink:#E4ECE1; --muted:#9FB0A3; --line:#26362B;
    --accent:#7ED3A1; --accent-fg:#08150D; --cell-off:#1C2A20;
    --winter:#8FA8E8; --winter-fg:#0B1220;
    --spring:#86CC7B; --spring-fg:#07200A;
    --summer:#F2C14A; --summer-fg:#1D1500;
    --autumn:#E9915A; --autumn-fg:#2A1004;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1610; --surface:#152019; --ink:#E4ECE1; --muted:#9FB0A3; --line:#26362B;
  --accent:#7ED3A1; --accent-fg:#08150D; --cell-off:#1C2A20;
  --winter:#8FA8E8; --winter-fg:#0B1220;
  --spring:#86CC7B; --spring-fg:#07200A;
  --summer:#F2C14A; --summer-fg:#1D1500;
  --autumn:#E9915A; --autumn-fg:#2A1004;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 56px;
}
.wrap{max-width:1180px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px;margin-bottom:22px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.02;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:8px 0 0;color:var(--muted);max-width:52ch}
.live{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.live b{display:block;font-family:var(--f-display);font-weight:400;font-size:2.4rem;line-height:1;color:var(--ink)}

.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:36px;align-items:start}
.panel{position:sticky;top:16px;display:grid;gap:20px;max-height:calc(100vh - 32px);overflow:auto;padding-right:6px}
.fgroup h2{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search::placeholder{color:var(--muted)}
.seasons{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip,.sbtn,.mbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;transition:background .12s,border-color .12s}
.chip:hover,.sbtn:hover,.mbtn:hover{border-color:var(--ink)}
.sbtn{display:flex;align-items:center;gap:8px;padding:8px 10px;text-align:left;font-weight:600}
.sbtn small{display:block;font-weight:400;color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.sbtn i{width:10px;height:10px;border-radius:50%;flex:none}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mbtn{padding:7px 0 6px;font-family:var(--f-mono);font-size:12px;text-align:center;position:relative}
.mbtn::after{content:"";position:absolute;left:6px;right:6px;bottom:2px;height:2px;border-radius:2px;background:var(--c)}
.on-btn{background:var(--accent)!important;color:var(--accent-fg)!important;border-color:var(--accent)!important}
.on-btn small{color:inherit!important;opacity:.8}
.mbtn.now::before{content:"";position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.mbtn.on-btn.now::before{background:var(--accent-fg)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:baseline}
.chip em{font-style:normal;font-family:var(--f-mono);font-size:11px;opacity:.7}
select.reg{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.checks{display:grid;gap:8px;margin-top:10px;font-size:13.5px}
.checks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:3px;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:8px;border:0;background:var(--surface);cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.row-actions{display:flex;gap:8px}
.ghost{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;font-weight:500}
.ghost:hover{border-color:var(--ink)}
.filter-toggle{display:none}

/* results */
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin-bottom:6px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.summary h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.summary span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.group{margin-top:26px}
.ghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.ghead h3{font-family:var(--f-display);font-weight:400;font-size:1.25rem;margin:0}
.ghead .en{color:var(--muted);font-size:13px}
.ghead .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.item{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,300px);gap:6px 28px;padding:13px 0;border-top:1px solid var(--line)}
.item .name{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.item h4{margin:0;font-size:16px;font-weight:700}
.item .en{color:var(--muted);font-size:13.5px}
.badge{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;padding:1px 6px;border-radius:99px;border:1px solid var(--muted);color:var(--muted);white-space:nowrap}
.badge.sf{border-color:var(--autumn);color:var(--autumn)}
.note{margin:3px 0 0;font-size:13.5px;color:var(--muted);max-width:62ch}
.where{margin:5px 0 0;font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.where mark{background:none;color:var(--accent);font-weight:500}
.yr{opacity:.85}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:2px}
.c{position:relative;display:block;height:24px;border-radius:3px;background:var(--cell-off);color:var(--muted);font-style:normal;font-family:var(--f-mono);font-size:10px;line-height:24px;text-align:center}
.c.on{font-weight:500}
.c.s-w.on{background:var(--winter);color:var(--winter-fg)}
.c.s-sp.on{background:var(--spring);color:var(--spring-fg)}
.c.s-su.on{background:var(--summer);color:var(--summer-fg)}
.c.s-a.on{background:var(--autumn);color:var(--autumn-fg)}
.c.sel::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;border-radius:2px;background:var(--ink)}
.range{margin-top:9px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:14px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

footer{margin-top:56px;padding-top:24px;border-top:2px solid var(--ink);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:24px 48px}
footer h2{font-family:var(--f-display);font-weight:400;font-size:1.25rem;margin:0 0 8px}
footer p,footer li{font-size:13.5px;color:var(--muted);max-width:68ch}
footer ul{margin:0 0 14px;padding-left:18px;display:grid;gap:4px}
footer h5{margin:12px 0 6px;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
a{color:var(--accent)}

@media (max-width:860px){
  body{padding-block:20px 40px}
  .layout{grid-template-columns:minmax(0,1fr);gap:18px}
  .filter-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;border:1px solid var(--ink);border-radius:10px;background:var(--surface);font-weight:600;cursor:pointer}
  .panel{position:static;max-height:none;overflow:visible;padding:0}
  .panel[hidden]{display:none}
  .live{text-align:left}
  footer{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .item{grid-template-columns:minmax(0,1fr)}
  .months{grid-template-columns:repeat(6,1fr)}
}
.lang{display:inline-block;margin-top:8px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;font-family:var(--f-mono);font-size:12px;color:var(--ink);text-decoration:none}
.lang:hover{border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Calendario di Stagione</h1>
      <p data-i="sub"></p>
    </div>
    <div class="live" aria-live="polite"><b id="count">0</b><span data-i="shown"></span><br><a class="lang" id="lang" href="#"></a></div>
  </header>

  <button class="filter-toggle" id="ftoggle" aria-expanded="false" aria-controls="panel"><span data-i="filters"></span><span id="fsum"></span></button>

  <div class="layout">
    <aside class="panel" id="panel">
      <div class="fgroup">
        <h2 data-i="search"></h2>
        <input id="q" class="search" type="search" autocomplete="off">
      </div>
      <div class="fgroup">
        <h2 data-i="season"></h2>
        <div class="seasons" id="seasons"></div>
      </div>
      <div class="fgroup">
        <h2 data-i="month"></h2>
        <div class="months" id="months"></div>
      </div>
      <div class="fgroup">
        <h2 data-i="group"></h2>
        <div class="cats" id="cats"></div>
      </div>
      <div class="fgroup">
        <h2 data-i="region"></h2>
        <select id="region" class="reg"></select>
        <div class="checks">
          <label><input type="checkbox" id="spec"> <span><span data-i="spec"></span><br><small style="color:var(--muted)" data-i="specHint"></small></span></label>
          <label><input type="checkbox" id="yr" checked> <span data-i="yr"></span></label>
        </div>
      </div>
      <div class="fgroup">
        <h2 data-i="groupBy"></h2>
        <div class="seg" id="group"><button data-g="cat"></button><button data-g="region"></button></div>
      </div>
      <div class="row-actions">
        <button class="ghost" id="now" data-i="today"></button>
        <button class="ghost" id="reset" data-i="clear"></button>
      </div>
    </aside>

    <main>
      <div class="summary"><h2 id="sumTitle"></h2><span id="sumMeta"></span></div>
      <div class="legend" id="legend">
        <span><i style="background:var(--winter)"></i><b id="leg-w" style="font-weight:400"></b></span>
        <span><i style="background:var(--spring)"></i><b id="leg-sp" style="font-weight:400"></b></span>
        <span><i style="background:var(--summer)"></i><b id="leg-su" style="font-weight:400"></b></span>
        <span><i style="background:var(--autumn)"></i><b id="leg-a" style="font-weight:400"></b></span>
        <span><i style="background:var(--cell-off)"></i><b data-i="legOff" style="font-weight:400"></b></span>
      </div>
      <div id="results"></div>
    </main>
  </div>

  <footer id="foot"></footer>
</div>

      <h2>How to read this</h2>
      <p>Coloured months show when a product is at its best, freshest, or traditionally made or released in Italy. Dried goods, cured meats and aged cheeses keep much longer, so their months mark the harvest, the curing season or the moment they are traditionally eaten.</p>
      <p>Timing shifts by weeks between the Alps and Sicily, and by altitude and weather year to year. Region tags mark places with a notable tradition or protected origin, not the only places a product grows. Hunting and fishing seasons are set locally; check your regional calendario venatorio or ittico, and the fermo pesca (closed fishing periods), which differ between the Adriatic and Tyrrhenian seas.</p>
      <p><b>DOP</b> and <b>IGP</b> are EU protected designations. <b>Presìdio</b> marks a Slow Food Presidium protecting a small traditional production.</p>

      <p>La Cucina Italiana (cucinaitaliana.it) non era raggiungibile quando è stata costruita questa pagina, quindi non è citata qui. Le voci uniscono queste fonti alla conoscenza generale dei prodotti italiani; considera i mesi una guida e verifica al mercato di zona.</p>
    </div>`
};

const TX = {
  en:{
    sub:"What is at its best in Italy, by month, season, food group and region. Pick a month or let it open on today.",
    shown:"foods shown", filters:"Filters", search:"Search", ph:"Artichokes, bitto, tuna…",
    season:"Season", month:"Month", group:"Food group", region:"Region", allRegions:"All regions",
    spec:"Regional specialties only", specHint:"Hide items grown widely across Italy",
    yr:"Include year-round staples", groupBy:"Group results by", gCat:"Food group", gReg:"Region",
    today:"Today's month", clear:"Clear all", legOff:"Not at its best",
    allYear:"All year", allFilters:"All regions and food groups",
    empty:"Nothing matches these filters.", clearF:"Clear all filters",
    yearRound:"Year-round", atBest:"At its best: ", wideLine:"Widely grown across Italy",
    wideHead:"Widely grown", wideSub:"Across all regions",
    bD:"Protected Designation of Origin", bI:"Protected Geographical Indication", bS:"Slow Food Presidium",
    otherName:"Italiano", otherHref:"it/index.html", legendLabel:"Legend", filtersLabel:"Filters"
  },
  it:{
    sub:"Cosa è al meglio in Italia, per mese, stagione, gruppo alimentare e regione. Scegli un mese o parti da quello di oggi.",
    shown:"alimenti mostrati", filters:"Filtri", search:"Cerca", ph:"Carciofi, bitto, tonno…",
    season:"Stagione", month:"Mese", group:"Gruppo alimentare", region:"Regione", allRegions:"Tutte le regioni",
    spec:"Solo specialità regionali", specHint:"Nascondi i prodotti diffusi in tutta Italia",
    yr:"Includi i prodotti di tutto l'anno", groupBy:"Raggruppa per", gCat:"Gruppo alimentare", gReg:"Regione",
    today:"Mese di oggi", clear:"Azzera tutto", legOff:"Fuori stagione",
    allYear:"Tutto l'anno", allFilters:"Tutte le regioni e i gruppi",
    empty:"Nessun risultato con questi filtri.", clearF:"Azzera i filtri",
    yearRound:"Tutto l'anno", atBest:"Al meglio: ", wideLine:"Diffuso in tutta Italia",
    wideHead:"Diffusi ovunque", wideSub:"",
    bD:"Denominazione di Origine Protetta", bI:"Indicazione Geografica Protetta", bS:"Presidio Slow Food",
    otherName:"English", otherHref:"../index.html", legendLabel:"Legenda", filtersLabel:"Filtri"
  }
};
const T = TX[LANG];

const MON = EN ? ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
               : ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
const MONFULL = EN ? ["January","February","March","April","May","June","July","August","September","October","November","December"]
                   : ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const INIT = EN ? "JFMAMJJASOND" : "GFMAMGLASOND";
const SEASONS = [
  {k:"w", n:EN?"Winter":"Inverno", alt:EN?"Inverno":"", m:[12,1,2], c:"--winter"},
  {k:"sp",n:EN?"Spring":"Primavera",alt:EN?"Primavera":"",m:[3,4,5], c:"--spring"},
  {k:"su",n:EN?"Summer":"Estate",  alt:EN?"Estate":"",   m:[6,7,8], c:"--summer"},
  {k:"a", n:EN?"Autumn":"Autunno", alt:EN?"Autunno":"",  m:[9,10,11],c:"--autumn"}
];
SEASONS.forEach(s=>{s.sub=MON[s.m[0]-1]+"–"+MON[s.m[2]-1]});
const seasonOf=m=>m===12||m<=2?"s-w":m<=5?"s-sp":m<=8?"s-su":"s-a";
const CATS=[
  {k:"V",it:"Verdure e funghi",en:"Vegetables and fungi"},
  {k:"F",it:"Frutta",en:"Fruit"},
  {k:"N",it:"Frutta secca",en:"Nuts"},
  {k:"G",it:"Legumi",en:"Legumes"},
  {k:"C",it:"Carne e selvaggina",en:"Meat and game"},
  {k:"S",it:"Salumi",en:"Cured meats"},
  {k:"L",it:"Latticini",en:"Dairy"},
  {k:"Q",it:"Formaggi",en:"Cheese"},
  {k:"P",it:"Pesce e frutti di mare",en:"Fish and seafood"}
];
const catName=c=>EN?c.en:c.it, catAlt=c=>EN?c.it:c.en;
const REGIONS=[["VDA","Valle d'Aosta","Aosta Valley"],["PIE","Piemonte","Piedmont"],["LIG","Liguria","Liguria"],["LOM","Lombardia","Lombardy"],["TAA","Trentino-Alto Adige","Trentino-South Tyrol"],["VEN","Veneto","Veneto"],["FVG","Friuli-Venezia Giulia","Friuli-Venezia Giulia"],["EMR","Emilia-Romagna","Emilia-Romagna"],["TOS","Toscana","Tuscany"],["UMB","Umbria","Umbria"],["MAR","Marche","Marche"],["LAZ","Lazio","Lazio"],["ABR","Abruzzo","Abruzzo"],["MOL","Molise","Molise"],["CAM","Campania","Campania"],["PUG","Puglia","Apulia"],["BAS","Basilicata","Basilicata"],["CAL","Calabria","Calabria"],["SIC","Sicilia","Sicily"],["SAR","Sardegna","Sardinia"]];
const RNAME=Object.fromEntries(REGIONS.map(r=>[r[0],EN?r[2]:r[1]]));

function parseMonths(s){
  const a=Array(12).fill(false);
  s.split(",").forEach(p=>{
    const [x,y]=p.split("-").map(Number); const e=y||x;
    if(x<=e){for(let i=x;i<=e;i++)a[i-1]=true}
    else{for(let i=x;i<=12;i++)a[i-1]=true;for(let i=1;i<=e;i++)a[i-1]=true}
  });
  return a;
}
function rangeLabel(a){
  if(a.every(Boolean))return T.yearRound;
  const out=[];
  for(let i=0;i<12;i++){
    if(a[i]&&!a[(i+11)%12]){
      let j=i;while(a[(j+1)%12])j=(j+1)%12;
      out.push(i===j?MON[i]:MON[i]+"–"+MON[j]);
    }
  }
  return out.join(", ");
}
const ITEMS=RAW.trim().split("\n").map(l=>{
  const f=l.split("|"); const mo=parseMonths(f[3]);
  return {name:f[0],en:f[1],cat:f[2],mo,reg:f[4].split(","),tags:f[5]||"",
    note:EN?(f[6]||""):(f[7]||f[6]||""),year:mo.every(Boolean)};
});
const label=it=>EN?it.en:it.name, other=it=>EN?it.name:"";

const state={q:"",months:new Set(),cats:new Set(),region:"",spec:false,yr:true,group:"cat"};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nowMonth=new Date().getMonth()+1;

function matches(it,ignoreCat){
  if(!ignoreCat&&state.cats.size&&!state.cats.has(it.cat))return false;
  if(state.months.size){let ok=false;state.months.forEach(m=>{if(it.mo[m-1])ok=true});if(!ok)return false}
  if(!state.yr&&it.year)return false;
  if(state.region){
    const direct=it.reg.includes(state.region);
    const wide=it.reg.includes("*");
    if(!(direct||(wide&&!state.spec)))return false;
  }else if(state.spec&&it.reg.includes("*"))return false;
  if(state.q){
    const q=state.q.toLowerCase();
    if(!(it.name.toLowerCase().includes(q)||it.en.toLowerCase().includes(q)||it.note.toLowerCase().includes(q)))return false;
  }
  return true;
}

function selLabel(){
  const ms=[...state.months].sort((a,b)=>a-b);
  if(!ms.length)return T.allYear;
  for(const s of SEASONS){
    if(ms.length===3&&s.m.every(m=>state.months.has(m)))return s.n+" ("+s.sub+")";
  }
  if(ms.length===1)return MONFULL[ms[0]-1];
  return ms.map(m=>MON[m-1]).join(", ");
}

function renderControls(){
  $("seasons").innerHTML=SEASONS.map(s=>{
    const on=s.m.every(m=>state.months.has(m));
    return `<button class="sbtn ${on?"on-btn":""}" data-s="${s.k}" aria-pressed="${on}"><i style="background:var(${s.c})"></i><span>${s.n}<small>${s.alt?s.alt+" · ":""}${s.sub}</small></span></button>`;
  }).join("");
  $("months").innerHTML=MON.map((n,i)=>{
    const m=i+1,on=state.months.has(m);
    const col=`var(${SEASONS.find(s=>s.m.includes(m)).c})`;
    return `<button class="mbtn ${on?"on-btn":""} ${m===nowMonth?"now":""}" style="--c:${col}" data-m="${m}" aria-pressed="${on}" title="${MONFULL[i]}">${n}</button>`;
  }).join("");
  $("cats").innerHTML=CATS.map(c=>{
    const n=ITEMS.filter(it=>it.cat===c.k&&matches(it,true)).length;
    const on=state.cats.has(c.k);
    return `<button class="chip ${on?"on-btn":""}" data-c="${c.k}" aria-pressed="${on}" title="${catAlt(c)}">${catName(c)}<em>${n}</em></button>`;
  }).join("");
  [...$("group").children].forEach(b=>b.classList.toggle("on-btn",b.dataset.g===state.group));
}

function stripHTML(it){
  return `<div class="strip" role="img" aria-label="${T.atBest}${rangeLabel(it.mo)}">`+
    it.mo.map((on,i)=>`<i class="c ${on?"on "+seasonOf(i+1):""} ${state.months.has(i+1)?"sel":""}">${INIT[i]}</i>`).join("")+
    `</div><div class="range">${rangeLabel(it.mo)}</div>`;
}
function whereHTML(it){
  if(it.reg.includes("*"))return `<p class="where">${T.wideLine}</p>`;
  return `<p class="where">`+it.reg.map(r=>r===state.region?`<mark>${RNAME[r]}</mark>`:RNAME[r]).join(" · ")+`</p>`;
}
function itemHTML(it){
  const badges=(it.tags.includes("D")?`<span class="badge" title="${T.bD}">DOP</span>`:"")+
    (it.tags.includes("I")?`<span class="badge" title="${T.bI}">IGP</span>`:"")+
    (it.tags.includes("S")?`<span class="badge sf" title="${T.bS}">Presìdio</span>`:"");
  return `<article class="item ${it.year?"yr":""}"><div><div class="name"><h4>${esc(label(it))}</h4>${other(it)?`<span class="en" lang="it">${esc(other(it))}</span>`:""}${badges}</div>${it.note?`<p class="note">${esc(it.note)}</p>`:""}${whereHTML(it)}</div><div>${stripHTML(it)}</div></article>`;
}
function sortItems(a){
  return a.slice().sort((x,y)=>(x.year-y.year)||label(x).localeCompare(label(y),LANG));
}
function groupHTML(title,sub,items){
  return `<section class="group"><div class="ghead"><h3>${title}</h3>${sub?`<span class="en">${sub}</span>`:""}<span class="n">${items.length}</span></div>${sortItems(items).map(itemHTML).join("")}</section>`;
}

function render(){
  renderControls();
  const list=ITEMS.filter(it=>matches(it,false));
  $("count").textContent=list.length;
  $("sumTitle").textContent=selLabel();
  const bits=[];
  if(state.region)bits.push(RNAME[state.region]);
  if(state.cats.size)bits.push([...state.cats].map(k=>catName(CATS.find(c=>c.k===k))).join(", "));
  if(state.q)bits.push("“"+state.q+"”");
  $("sumMeta").textContent=bits.length?bits.join(" · "):T.allFilters;
  $("fsum").textContent=selLabel()+(state.region?" · "+RNAME[state.region]:"");
  let html="";
  if(!list.length){
    html=`<div class="empty"><p>${T.empty}</p><button class="ghost" id="reset2">${T.clearF}</button></div>`;
  }else if(state.group==="cat"){
    CATS.forEach(c=>{const g=list.filter(it=>it.cat===c.k);if(g.length)html+=groupHTML(catName(c),catAlt(c),g)});
  }else{
    REGIONS.forEach(([code])=>{
      if(state.region&&state.region!==code)return;
      const g=list.filter(it=>it.reg.includes(code));
      if(g.length)html+=groupHTML(RNAME[code],"",g);
    });
    const wide=list.filter(it=>it.reg.includes("*"));
    if(wide.length)html+=groupHTML(T.wideHead,T.wideSub,wide);
  }
  $("results").innerHTML=html;
}

/* events */
$("seasons").addEventListener("click",e=>{
  const b=e.target.closest("[data-s]");if(!b)return;
  const s=SEASONS.find(x=>x.k===b.dataset.s);
  const all=s.m.every(m=>state.months.has(m));
  s.m.forEach(m=>all?state.months.delete(m):state.months.add(m));
  render();
});
$("months").addEventListener("click",e=>{
  const b=e.target.closest("[data-m]");if(!b)return;
  const m=+b.dataset.m;state.months.has(m)?state.months.delete(m):state.months.add(m);render();
});
$("cats").addEventListener("click",e=>{
  const b=e.target.closest("[data-c]");if(!b)return;
  const k=b.dataset.c;state.cats.has(k)?state.cats.delete(k):state.cats.add(k);render();
});
$("group").addEventListener("click",e=>{
  const b=e.target.closest("[data-g]");if(!b)return;state.group=b.dataset.g;render();
});
$("q").addEventListener("input",e=>{state.q=e.target.value.trim();render()});
$("region").addEventListener("change",e=>{state.region=e.target.value;render()});
$("spec").addEventListener("change",e=>{state.spec=e.target.checked;render()});
$("yr").addEventListener("change",e=>{state.yr=e.target.checked;render()});
$("now").addEventListener("click",()=>{state.months=new Set([nowMonth]);render()});
function resetAll(){
  state.q="";state.months=new Set();state.cats=new Set();state.region="";state.spec=false;state.yr=true;
  $("q").value="";$("region").value="";$("spec").checked=false;$("yr").checked=true;render();
}
$("reset").addEventListener("click",resetAll);
$("results").addEventListener("click",e=>{if(e.target.id==="reset2")resetAll()});
$("ftoggle").addEventListener("click",()=>{
  const p=$("panel"),open=p.hidden;p.hidden=!open;$("ftoggle").setAttribute("aria-expanded",String(open));
});

/* static text */
document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=T[el.dataset.i]});
$("q").placeholder=T.ph;
$("q").setAttribute("aria-label",T.search);
$("region").setAttribute("aria-label",T.region);
$("panel").setAttribute("aria-label",T.filtersLabel);
$("legend").setAttribute("aria-label",T.legendLabel);
$("foot").innerHTML=FOOT[LANG];
const lk=$("lang");lk.textContent=T.otherName;lk.href=T.otherHref;lk.lang=EN?"it":"en";
$("group").children[0].textContent=T.gCat;$("group").children[1].textContent=T.gReg;
SEASONS.forEach(s=>{const el=$("leg-"+s.k);if(el)el.textContent=s.n});

/* init */
$("region").innerHTML=`<option value="">${T.allRegions}</option>`+REGIONS.map(([c])=>`<option value="${c}">${RNAME[c]}</option>`).join("");
const mq=window.matchMedia("(max-width:860px)");
function syncPanel(){ $("panel").hidden=mq.matches; $("ftoggle").setAttribute("aria-expanded","false"); }
syncPanel();
mq.addEventListener("change",syncPanel);
state.months=new Set([nowMonth]);
render();
</script>
</body>
